<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codec</title>
<style>
:root {
  --bg: #000000;
  --fg: #ffffff;
  --panel: #141414;
  --border: #444444;
  --input: #1e1e1e;
  --muted: #888888;
  --hover: #2a2a2a;
  --btn: #252525;
  --accent: #3F48CC;
  --accent-hover: #5a63d8;
  --app-h: 580px;
}
:root[data-theme="light"] {
  --bg: #ffffff;
  --fg: #000000;
  --panel: #f3f3f3;
  --border: #cccccc;
  --input: #ffffff;
  --muted: #666666;
  --hover: #e4e4e4;
  --btn: #e8e8e8;
}
* { box-sizing: border-box; }
html, body { 
  height: 100%; 
  margin: 0; 
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  color: var(--fg);
  font-family: Inter, "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  font-size: 14px;
}
button, input { font-family: inherit; color: inherit; }

.app {
  height: var(--app-h);
  width: 1100px;
  max-width: 96vw;
  margin: auto;
  display: grid;
  grid-template-columns: 220px 1fr;
  gap: 14px;
  padding: 14px;
}

.sidebar { display: flex; flex-direction: column; min-height: 0; }
.btn-accent {
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
}
.btn-accent:hover { background: var(--accent-hover); }
#newChat { padding: 10px 12px; margin-bottom: 10px; width: 100%; }

.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
}
#chatList { flex: 1; overflow-y: auto; padding: 4px; min-height: 0; }
.chat {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 8px 10px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 13px;
  color: var(--fg);
  user-select: none;
}
.chat:hover { background: var(--hover); }
.chat.selected { background: var(--accent); color: #fff; }
.chat.selected:hover { background: var(--accent-hover); }
.chat .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat .edit {
  background: transparent;
  border: none;
  color: inherit;
  opacity: 0.7;
  cursor: pointer;
  padding: 2px 6px;
  font-size: 13px;
}
.chat .edit:hover { opacity: 1; }
.chat input {
  flex: 1;
  min-width: 0;
  background: var(--input);
  color: var(--fg);
  border: 1px solid var(--accent);
  border-radius: 4px;
  padding: 4px 6px;
  font-size: 13px;
  outline: none;
}
input::selection { background: var(--accent); color: #fff; }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.header {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  margin-bottom: 10px;
}
#settingsBtn {
  background: var(--btn);
  color: var(--fg);
  border: 1px solid var(--accent);
  border-radius: 6px;
  padding: 6px 12px;
  font-size: 13px;
  cursor: pointer;
}
#hint { text-align: center; font-size: 17px; font-weight: 600; }
.meta { text-align: right; color: var(--muted); font-size: 15px; line-height: 1.3; }

#messages { flex: 1; overflow-y: auto; padding: 8px; min-height: 0; }
.msg { padding: 8px 12px; white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; }

.composer { display: flex; gap: 10px; margin-top: 10px; }
#input {
  flex: 1;
  height: 38px;
  background: var(--input);
  color: var(--fg);
  border: 1px solid var(--accent);
  border-radius: 6px;
  padding: 0 12px;
  font-size: 13px;
  outline: none;
}
#input::placeholder { color: var(--muted); }
#send { height: 38px; padding: 0 18px; }

.footer-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 6px;
  font-size: 12px;
  color: var(--muted);
}
#status:empty { display: none; }
.disclaimer { text-align: right; opacity: 0.8; }

.verword { color: var(--accent); }

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 10;
}
.overlay.open { display: flex; }
.dialog {
  width: 360px;
  max-width: calc(100% - 28px);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.dialog .ver { text-align: right; font-size: 15px; font-weight: 600; }
.dialog .ver b { color: var(--accent); }
.dialog button.outline {
  background: var(--btn);
  color: var(--fg);
  border: 1px solid var(--accent);
  border-radius: 6px;
  padding: 8px;
  font-size: 13px;
  cursor: pointer;
}
.dialog input {
  height: 38px;
  background: var(--input);
  color: var(--fg);
  border: 1px solid var(--accent);
  border-radius: 6px;
  padding: 0 12px;
  font-size: 14px;
  outline: none;
}
.dialog .label { font-size: 15px; font-weight: 600; }
#loginBtn { padding: 10px; }

@media (max-width: 640px) {
  .app { height: 100%; grid-template-columns: 1fr; grid-template-rows: 180px 1fr; }
  .meta { display: none; }
}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <button id="newChat" class="btn-accent"></button>
    <div id="chatList" class="panel"></div>
  </aside>

  <main class="main">
    <div class="header">
      <button id="settingsBtn"></button>
      <div id="hint"></div>
      <div class="meta">
        <div id="date"></div>
        <div><span class="verword">Version</span> 4.0 beta</div>
      </div>
    </div>

    <div id="messages" class="panel"></div>

    <div class="composer">
      <input id="input" type="text" autocomplete="off">
      <button id="send" class="btn-accent"></button>
    </div>
    
    <div class="footer-info">
      <div id="status"></div>
      <div class="disclaimer" id="disclaimerText">Codec может ошибаться.</div>
    </div>
  </main>
</div>

<div id="settings" class="overlay">
  <div class="dialog">
    <div class="ver"><b>Version</b> 4.0 beta</div>
    <button id="themeBtn" class="outline"></button>
    <button id="langBtn" class="outline"></button>
    <button id="closeBtn" class="outline"></button>
  </div>
</div>

<div id="login" class="overlay">
  <div class="dialog">
    <div id="loginLabel" class="label"></div>
    <input id="nameInput" type="text" maxlength="40" autocomplete="off">
    <button id="loginBtn" class="btn-accent"></button>
  </div>
</div>

<script>
const API = window.location.origin;

const T = {
  ru: {
    settings: "Настройки",
    hint: "Пиши что думаешь?",
    placeholder: "Введите сообщение...",
    send: "Отправить",
    newChat: "+ Новый чат",
    rename: "Переименовать",
    chat: "Чат",
    theme: "Сменить тему",
    lang: "English",
    close: "Закрыть",
    you: "Вы",
    greet: (n) => "Привет, " + n + "! Чем могу помочь?",
    ready: "Codec успешно запущен и готов принимать сообщения!",
    noServer: "Предупреждение: не удалось достучаться до сервера.",
    thinking: "Codec думает...",
    errStatus: (c) => "Ошибка: сервер вернул статус " + c + ".",
    errConn: "Ошибка: не удалось подключиться к серверу.",
    askName: "Как вас зовут?",
    namePh: "Ваше имя",
    login: "Войти",
    disclaimer: "Codec может ошибаться проверяйте Информацию!"
  },
  en: {
    settings: "Settings",
    hint: "What's on your mind?",
    placeholder: "Type a message...",
    send: "Send",
    newChat: "+ New chat",
    rename: "Rename",
    chat: "Chat",
    theme: "Switch theme",
    lang: "Русский",
    close: "Close",
    you: "You",
    greet: (n) => "Hi, " + n + "! How can I help?",
    ready: "Codec is running and ready to chat!",
    noServer: "Warning: could not reach the server.",
    thinking: "Codec is thinking...",
    errStatus: (c) => "Error: server returned status " + c + ".",
    errConn: "Error: could not connect to the server.",
    askName: "What's your name?",
    namePh: "Your name",
    login: "Log in",
    disclaimer: "Codec can make mistakes."
  }
};

let S = { chats: [], selected: null, counter: 0, dark: true, ru: true, name: "" };
try {
  const raw = localStorage.getItem("codec_state");
  if (raw) Object.assign(S, JSON.parse(raw));
} catch (e) {}

function save() {
  try { localStorage.setItem("codec_state", JSON.stringify(S)); } catch (e) {}
}

const $ = (id) => document.getElementById(id);
const t = () => (S.ru ? T.ru : T.en);
const cur = () => S.chats.find((c) => c.id === S.selected);

let editingId = null;
let pending = 0;

function newChat() {
  S.counter += 1;
  const c = { id: Date.now() + "-" + S.counter, title: t().chat + " " + S.counter, messages: [] };
  S.chats.push(c);
  S.selected = c.id;
  save();
  return c;
}

function setStatus(text) {
  $("status").textContent = text;
}

function applyTheme() {
  document.documentElement.dataset.theme = S.dark ? "dark" : "light";
}

function applyLang() {
  const x = t();
  document.documentElement.lang = S.ru ? "ru" : "en";
  $("newChat").textContent = x.newChat;
  $("settingsBtn").textContent = x.settings;
  $("hint").textContent = x.hint;
  $("input").placeholder = x.placeholder;
  $("send").textContent = x.send;
  $("themeBtn").textContent = x.theme;
  $("langBtn").textContent = x.lang;
  $("closeBtn").textContent = x.close;
  $("loginLabel").textContent = x.askName;
  $("nameInput").placeholder = x.namePh;
  $("loginBtn").textContent = x.login;
  $("disclaimerText").textContent = x.disclaimer;
  renderChats();
}

function renderChats() {
  const list = $("chatList");
  list.innerHTML = "";
  S.chats.forEach((c) => {
    const row = document.createElement("div");
    row.className = "chat" + (c.id === S.selected ? " selected" : "");
    row.dataset.id = c.id;

    if (c.id === editingId) {
      const inp = document.createElement("input");
      inp.value = c.title;
      inp.maxLength = 40;
      let finished = false;
      const finish = (ok) => {
        if (finished) return;
        finished = true;
        const v = inp.value.trim();
        if (ok && v) c.title = v;
        editingId = null;
        save();
        renderChats();
      };
      inp.addEventListener("keydown", (e) => {
        if (e.key === "Enter") finish(true);
        else if (e.key === "Escape") finish(false);
      });
      inp.addEventListener("blur", () => finish(true));
      inp.addEventListener("click", (e) => e.stopPropagation());
      inp.addEventListener("dblclick", (e) => e.stopPropagation());
      row.appendChild(inp);
    } else {
      const title = document.createElement("span");
      title.className = "title";
      title.textContent = c.title;
      const edit = document.createElement("button");
      edit.className = "edit";
      edit.textContent = "✎";
      edit.title = t().rename;
      edit.dataset.action = "rename";
      row.appendChild(title);
      row.appendChild(edit);
    }
    list.appendChild(row);
  });
}

function startRename(id) {
  editingId = id;
  renderChats();
  const inp = $("chatList").querySelector("input");
  if (inp) {
    inp.focus();
    inp.select();
  }
}

function renderMessages() {
  const box = $("messages");
  box.innerHTML = "";
  const chat = cur();
  if (!chat) return;
  chat.messages.forEach((m) => {
    const d = document.createElement("div");
    d.className = "msg";
    d.textContent = m;
    box.appendChild(d);
  });
  box.scrollTop = box.scrollHeight;
}

function render() {
  renderChats();
  renderMessages();
}

function updateDate() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, "0");
  $("date").textContent =
    p(d.getDate()) + "." + p(d.getMonth() + 1) + "." + d.getFullYear() + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}

async function checkServer() {
  for (let i = 0; i < 15; i++) {
    try {
      const r = await fetch(API + "/");
      if (r.ok) {
        setStatus(t().ready);
        return;
      }
    } catch (e) {}
    await new Promise((res) => setTimeout(res, 1000));
  }
  setStatus(t().noServer);
}

async function send() {
  const input = $("input");
  const text = input.value.trim();
  if (!text) return;

  const chat = cur();
  chat.messages.push(t().you + " → " + text);
  input.value = "";
  save();
  renderMessages();

  pending += 1;
  setStatus(t().thinking);

  const payloadMessages = [];
  const slice = chat.messages.slice(-7);
  slice.forEach(msg => {
    if (msg.startsWith(t().you + " → ")) {
      payloadMessages.push({ role: "user", content: msg.slice(t().you.length + 3) });
    } else if (msg.startsWith("Codec → ")) {
      payloadMessages.push({ role: "assistant", content: msg.slice(8) });
    }
  });

  let reply = "";
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 60000);
  try {
    const r = await fetch(API + "/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ 
        messages: payloadMessages,
        username: S.name || "Данюха"
      }),
      signal: ctrl.signal
    });
    if (r.ok) {
      let d = null;
      try { d = await r.json(); } catch (e) {}
      reply = d && d.response ? d.response : "…";
    } else {
      reply = t().errStatus(r.status);
    }
  } catch (e) {
    reply = t().errConn;
  }
  clearTimeout(timer);

  pending -= 1;
  chat.messages.push("Codec → " + reply);
  save();
  if (chat.id === S.selected) renderMessages();
  setStatus(pending > 0 ? t().thinking : "");
}

function showLogin() {
  $("login").classList.add("open");
  $("nameInput").focus();
}

function doLogin() {
  const v = $("nameInput").value.trim();
  if (!v) return;
  S.name = v;
  const chat = cur();
  if (chat && chat.messages.length === 0) chat.messages.push("Codec → " + t().greet(v));
  save();
  $("login").classList.remove("open");
  renderMessages();
  $("input").focus();
}

$("chatList").addEventListener("click", (e) => {
  const row = e.target.closest(".chat");
  if (!row || editingId) return;
  if (e.target.dataset.action === "rename") {
    startRename(row.dataset.id);
    return;
  }
  S.selected = row.dataset.id;
  save();
  render();
});

$("chatList").addEventListener("dblclick", (e) => {
  const row = e.target.closest(".chat");
  if (row && !editingId) startRename(row.dataset.id);
});

$("newChat").addEventListener("click", () => {
  newChat();
  render();
  $("input").focus();
});

$("send").addEventListener("click", send);
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter") send();
});

$("settingsBtn").addEventListener("click", () => $("settings").classList.add("open"));
$("closeBtn").addEventListener("click", () => $("settings").classList.remove("open"));
$("settings").addEventListener("click", (e) => {
  if (e.target === $("settings")) $("settings").classList.remove("open");
});

$("themeBtn").addEventListener("click", () => {
  S.dark = !S.dark;
  save();
  applyTheme();
});

$("langBtn").addEventListener("click", () => {
  S.ru = !S.ru;
  save();
  applyLang();
});

$("loginBtn").addEventListener("click", doLogin);
$("nameInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") doLogin();
});

if (!S.chats.length) newChat();
if (!cur()) S.selected = S.chats[0].id;
applyTheme();
applyLang();
render();
updateDate();
setInterval(updateDate, 30000);
if (!S.name) showLogin();
checkServer();
</script>
</body>
</html>
